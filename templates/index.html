<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción de Gatitos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Nuestros Bebés en Adopción</h1>

        <!-- Tarjeta de Gatito 1 -->
        <div class="card">
            <!-- Usamos url_for para apuntar correctamente a la carpeta static -->
            <img src="{{ url_for('static', filename='gato1.jpg') }}" alt="Gatito 1">
            
            <h2>Gatito 1</h2>
            <p><span class="icon">⏰</span> Edad: <strong>1 mes</strong></p>
            <p class="description">Tierno, juguetón y busca un hogar lleno de amor.</p>
            
            <a href="https://wa.me/tu_numero_aqui" target="_blank" class="btn-whatsapp">
                ¡Quiero adoptar a Gatito 1!
            </a>
        </div>

        <!-- Puedes repetir la misma estructura para el Gato 2 y Gato 3 cambiando el nombre del archivo -->
        <div class="card">
            <img src="{{ url_for('static', filename='gato2.jpg') }}" alt="Gatito 2">
            <h2>Gatito 2</h2>
            <p><span class="icon">⏰</span> Edad: <strong>1 mes y medio</strong></p>
            <p class="description">Muy activo y cariñoso.</p>
            <a href="https://wa.me/tu_numero_aqui" target="_blank" class="btn-whatsapp">
                ¡Quiero adoptar a Gatito 2!
            </a>
        </div>

        <div class="card">
            <img src="{{ url_for('static', filename='gato3.jpg') }}" alt="Gatito 3">
            <h2>Gatito 3</h2>
            <p><span class="icon">⏰</span> Edad: <strong>2 meses</strong></p>
            <p class="description>Tranquilo y listo para un nuevo hogar.</p>
            <a href="https://wa.me/tu_numero_aqui" target="_blank" class="btn-whatsapp">
                ¡Quiero adoptar a Gatito 3!
            </a>
        </div>

    </div>

</body>
</html>
